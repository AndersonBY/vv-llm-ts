name: TypeScript quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run contract:check
      - run: npm run lint
      - run: npm test
      - run: npm run examples:check
      - run: npm run pack:check
